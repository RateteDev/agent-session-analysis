<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>agent-session-analysis</title>
    <link rel="stylesheet" href="./styles/global/tokens.css" />
    <link rel="stylesheet" href="./styles/global/global.css" />
    <link rel="stylesheet" href="./styles/components/button.css" />
    <link rel="stylesheet" href="./styles/components/badge.css" />
    <link rel="stylesheet" href="./styles/components/tabs.css" />
    <link rel="stylesheet" href="./styles/components/icon.css" />
    <link rel="stylesheet" href="./styles/components/header.css" />
    <link rel="stylesheet" href="./styles/components/load-error.css" />
    <link rel="stylesheet" href="./styles/components/drop-overlay.css" />
    <link rel="stylesheet" href="./styles/components/archive.css" />
    <link rel="stylesheet" href="./styles/components/role-filter.css" />
    <link rel="stylesheet" href="./styles/components/message.css" />
    <link rel="stylesheet" href="./styles/components/event.css" />
    <script type="module" src="./main.ts"></script>
  </head>
  <body>
    <header id="app-header" class="app-header">
      <h1>agent-session-analysis</h1>
      <button id="open" class="button app-header-open" type="button">開く</button>
    </header>
    <input
      id="file"
      type="file"
      accept=".jsonl,.ndjson,application/x-ndjson,text/plain"
      hidden
    />
    <main>
      <p id="error" class="load-error" role="alert" hidden></p>
      <div id="viewer" hidden></div>
    </main>
    <div id="drop-overlay" class="drop-overlay" hidden>
      <p class="drop-overlay-message">JSONLをドロップして開く</p>
    </div>
  </body>
</html>
